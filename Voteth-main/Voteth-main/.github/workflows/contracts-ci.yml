# =============================================================================
# VotEth 2.0 — Contracts CI Pipeline
# =============================================================================
#
# Runs on every PR and push to main that touches the contracts/ directory.
# Validates: compilation, tests, coverage (≥80% per NFR), gas report, and contract size.
#
# @see CONTRIBUTING.md for CI expectations
# @see docs/adr/ADR-001-technology-stack.md for Hardhat/Solidity rationale

name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"

defaults:
  run:
    working-directory: contracts

jobs:
  # ===========================================================================
  # COMPILE — Solidity compilation check
  # ===========================================================================
  compile:
    name: Compile Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Check contract sizes
        run: npm run size

  # ===========================================================================
  # TEST — Hardhat test suite with gas reporting
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with gas report
        run: npm run gas-report
        env:
          REPORT_GAS: "true"

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: contracts/gas-report.txt
          retention-days: 14

  # ===========================================================================
  # COVERAGE — Solidity coverage (≥80% target per NFR)
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: contracts/coverage/
          retention-days: 14

  # ===========================================================================
  # LINT — Solhint for Solidity style and security rules
  # ===========================================================================
  lint:
    name: Solhint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Solhint
        run: npm run lint
