# =============================================================================
# VotEth 2.0 — Frontend CI Pipeline
# =============================================================================
#
# Runs on every PR and push to main.
# Validates: type checking, linting, tests, build, and Lighthouse (if applicable).
#
# Free tier: GitHub Actions provides 2000 CI minutes/month for public repos.
#
# @see CONTRIBUTING.md for CI expectations
# @see docs/adr/ADR-001-technology-stack.md for tooling rationale

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  # ===========================================================================
  # TYPE CHECK — TypeScript strict mode validation
  # ===========================================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

  # ===========================================================================
  # LINT — ESLint with zero warnings policy
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ===========================================================================
  # TEST — Vitest with coverage thresholds (≥70% per NFR)
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # ===========================================================================
  # BUILD — Verify production build succeeds
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Provide placeholder env vars for build validation
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
          VITE_CHAIN_ID: "80002"
          VITE_APP_ENV: "ci"
          VITE_APP_URL: "https://placeholder.voteth.app"
          VITE_REGISTRY_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
          VITE_ELECTION_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
          VITE_VERIFIER_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
